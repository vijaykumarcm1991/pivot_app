# Alembic configuration. The database URL is taken from app.config.database
# (DB_PATH env var), so this file only needs the script location.
#
#   cd backend
#   alembic upgrade head                       # apply migrations
#   alembic revision -m "add x" --autogenerate # create a new migration
#
# The app also runs `upgrade head` automatically on startup.
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
