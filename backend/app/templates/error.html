{% extends "base.html" %}
{% block title %}{{ status_code }} — {{ heading }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:70vh;">
  <div class="text-center" style="max-width:520px;">
    <div class="empty-icon" style="width:64px;height:64px;font-size:1.7rem;background:var(--warning-soft);color:var(--warning)">
      <i class="bi {{ icon|default('bi-exclamation-triangle') }}"></i>
    </div>
    <div class="page-eyebrow mb-1">Error {{ status_code }}</div>
    <h1 class="page-title mb-2">{{ heading }}</h1>
    <p class="text-muted">{{ message }}</p>
    <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
      <button type="button" class="btn btn-outline-secondary" onclick="history.length > 1 ? history.back() : (window.location='/');">
        <i class="bi bi-arrow-left me-1"></i>Go back
      </button>
      <a href="/pivot" class="btn btn-primary"><i class="bi bi-grid-3x3-gap me-1"></i>Pivot Builder</a>
    </div>
  </div>
</div>
{% endblock %}
