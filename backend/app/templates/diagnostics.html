{% extends "base.html" %}
{% block title %}Diagnostics — {{ app_name() }}{% endblock %}

{% block content %}

<header class="page-header">
  <div>
    <div class="page-eyebrow">Admin</div>
    <h1 class="page-title">System diagnostics</h1>
    <p class="page-subtitle">Live health of the database, storage, cache and runtime.</p>
  </div>
  <div class="page-actions">
    <a href="/api/diagnostics" target="_blank" rel="noopener" class="btn btn-sm btn-outline-secondary"><i class="bi bi-filetype-json me-1"></i>JSON</a>
    <button type="button" class="btn btn-sm btn-primary" id="refreshBtn"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
  </div>
</header>

<div class="row g-3" id="diagCards">
  <div class="col-12 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Loading diagnostics…</div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/diagnostics.js?v=6"></script>
{% endblock %}
