upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Must be >= the app's MAX_UPLOAD_CEILING_BYTES (500 MB) so the app,
    # not nginx, decides — the app returns a JSON error the UI can show.
    client_max_body_size 510M;

    # Proxy all requests to FastAPI
    location / {
        proxy_pass         http://backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Serve static files directly via nginx for performance
    location /static/ {
        proxy_pass http://backend/static/;
    }
}
